name: Canary

# Why this exists (#551): production can stop answering well without any
# alert seeing it. The ask route is stream-first, so a dead provider, a spent
# `tramitico-prod` cap, a revoked key or a paused database come back as HTTP
# 200 with an error part inside (runbook §1.3); Hobby has no log drain to
# count them (§3.2), and runtime logs keep one hour. Production ran without
# its rerank for three weeks (#498) because nothing looked. So once a day this
# asks tramitico.com three fixed questions through the real /api/ask and
# fails when an answer is not one we would stand behind — `scripts/canary.ts`
# says exactly what that means. A failure files an issue, as keepalive.yml
# does, because a scheduled workflow's own failure email is easy to miss.
#
# No secrets: /api/ask is public. Each run spends three of the runner IP's
# anonymous asks and about US$1.50 a month of tramitico-prod's US$10 cap
# (runbook §3.3).
# GitHub disables this, like every scheduled workflow here, after 60 days
# without a commit (runbook §7, #553).
on:
  schedule:
    # 12:23 UTC (06:23 in Costa Rica): the morning's issue is waiting when the
    # owner gets up, and off the hour GitHub's scheduler is least loaded.
    - cron: "23 12 * * *"
  workflow_dispatch:
    inputs:
      host:
        description: Origin to ask (a nonsense host forces a failure)
        required: false
        default: https://tramitico.com

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node only: the script is dependency-free and Node 24 runs its
      # TypeScript as it is, so no install runs code from the lockfile in a
      # job that can write issues.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Ask production
        env:
          # Through env, never interpolated into the script: a dispatch input
          # is caller text. Empty on a schedule, which the script reads as
          # https://tramitico.com.
          CANARY_HOST: ${{ inputs.host }}
          CANARY_REPORT: canary-report.md
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/canary.ts
      # One open issue at a time: a provider that stays down for a week is one
      # incident, so later failures comment on the open issue rather than
      # filing seven.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Production canary failed"
          {
            printf '%s\n\n' "Run log: $RUN_URL"
            if [ -f canary-report.md ]; then
              cat canary-report.md
            else
              printf '%s\n' 'The canary stopped before asking anything; the run log names the step.'
            fi
          } > report.md

          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
            exit 0
          fi

          {
            printf '%s\n\n' 'The daily canary asked production its fixed questions and at least one answer failed. An `error part` is the refunded/charged error the telemetry counts (`answer_failed` with a 4xx `providerError` is usually the spent `tramitico-prod` cap or a revoked key); `degraded` is Voyage embeddings down; a decline or an unresolved marker is a quality regression; `request failed` or a non-200 is the site itself. Runbook §3.3 has the reading; later failures comment here until this is closed.'
            printf '%s\n\n' 'Contract: [docs/runbook.md §3.3](https://github.com/rjwrld/tramitico/blob/main/docs/runbook.md#33-the-daily-canary-551--provider-failure-coverage-on-hobby) · #551.'
            cat report.md
          } > body.md
          gh issue create --title "$title" --label needs-triage --body-file body.md
