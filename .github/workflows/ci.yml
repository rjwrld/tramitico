name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository: it installs, lints, builds
# and runs tests. Read-only by default rather than whatever the repository
# default happens to be, so a compromised dependency in a PR build cannot push a
# commit or open a release. A job that ever needs more elevates itself.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The production tree carries no high/critical advisories (#122). Only
      # --prod is gated: build-time tooling is not attacker-reachable at
      # runtime, and moderate/low findings are accepted risk recorded on #121 —
      # an acceptance that expires 2026-11-12, when this level gets revisited.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests only — no database, no API keys, nothing to skip (#129).
      # The suites that need an environment run in the `suites` job below.
      - run: pnpm test:unit
      - run: pnpm format:check
      # The build runs with egress denied (#88): a build-time fetch — a font
      # loader, an asset pipeline reaching a CDN, a plugin phoning home — fails
      # here, on the PR that introduces it, rather than on a random future day.
      # Same install, same build, so it costs no extra wall-clock.
      - run: pnpm build:hermetic

  # Database suites — and the local-Supabase e2e lane — against a throwaway
  # local stack (issue #147, extended by #161).
  #
  # `supabase start` applies supabase/migrations/ to a fresh Postgres and hands
  # back its own credentials, so this lane needs no secrets and cannot reach a
  # real project. That is what makes it safe to run on every PR: the suites
  # here create and delete auth users and insert rows, which is exactly why the
  # previous secrets-fed version of this job — pointed at whatever
  # `secrets.SUPABASE_URL` named — was never turned on.
  #
  # It also closes the #129 gap that #147 was filed for: the #123 lockdown
  # assertions used to gate on a credential that was never set, so the guard
  # for a regenerated schema dump re-adding `GRANT ALL ... TO authenticated`
  # was wired to nothing. Here the prerequisites always hold, so
  # `integrationSuite` runs the suites rather than failing or skipping them,
  # and a re-added grant fails this job with zero secrets configured.
  #
  # The corpus-dependent suites (retrieval, groundedness, hit-rate, the
  # real-table dataset census) are NOT here — they need an ingested corpus and
  # paid providers, which a throwaway stack has neither of. They run on a
  # schedule in eval.yml. Dataset *satisfiability* is now checked per PR by the
  # unit lane instead, against the committed eval/corpus-index.json (#163).
  suites:
    runs-on: ubuntu-latest
    env:
      # supabase/config.toml enables the GitHub and Google auth providers with
      # `env(...)` client ids, and GoTrue refuses to boot without them.
      # Placeholders, matching what .env.local carries locally: no suite in
      # this lane exercises an OAuth provider flow, and no real credential
      # belongs in a lane defined by having none.
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pinned: the stack this lane asserts against is part of the test
          # fixture, and a CLI auto-update is not a reason for a PR to go red.
          version: 2.105.0
      # Only the containers the suites actually dial. Studio, storage, edge
      # functions and analytics are wall-clock this lane never uses; if the
      # stack ever misbehaves here, shortening this list is the first thing to
      # try. `inbucket` (mail) came back off the list with #161: that spec
      # signs a browser in by minting a magic link through GoTrue's admin API,
      # and a mail stack with nowhere to deliver is not a failure mode worth
      # discovering on someone else's PR.
      - name: Start a local Supabase stack on this PR's migrations
        run: >
          supabase start
          -x studio,imgproxy,storage,edge-runtime,functions,analytics,vector,realtime,meta
      # The stack prints its own keys — fixed local development values, not
      # secrets. Mapped onto the names the suites read. No SUPABASE_ANON_KEY:
      # its only reader was retrieval's `grants` suite, which now runs in
      # eval.yml, and the pgTAP lane checks the same ACLs far more thoroughly.
      - name: Export the stack's credentials
        run: |
          eval "$(supabase status -o env)"
          if [ -z "$API_URL" ] || [ -z "$SERVICE_ROLE_KEY" ] || \
             [ -z "$PUBLISHABLE_KEY" ]; then
            echo "supabase status did not report a full credential set." >&2
            exit 1
          fi
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"
      # The SQL half of the lockdown proof (#147 req. 3, 4): every public
      # object's ACL, the default privileges a future table inherits, and the
      # three RLS policies on `questions`. Cheapest and most specific check
      # here, so it runs first.
      - run: pnpm test:db
      # The PostgREST half: a signed-in and an anonymous client both get 42501
      # on `questions`, `chunks` and `documents` (#123).
      - run: pnpm test:integration
        if: ${{ !cancelled() }}
      # The browser half (#161): `*.local.spec.ts` need a real Supabase in the
      # loop, so this is the only lane that can run them — the default e2e job
      # runs with the server-side Supabase env pinned empty. Both specs stay
      # keyless here: the stack carries no corpus, so retrieval comes back
      # empty and /api/ask takes its weak-retrieval path without a model call,
      # and playwright.local.config.ts pins ANTHROPIC_API_KEY empty so an ask
      # that somehow did retrieve would fail loudly rather than need a secret.
      - run: pnpm exec playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: pnpm test:e2e:local
        if: ${{ !cancelled() }}
      # The list reporter writes nothing to disk; `test-results/` is where a
      # failed spec leaves its error context and any trace.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-local-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: supabase status || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
