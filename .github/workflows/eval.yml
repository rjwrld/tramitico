name: Eval

# The corpus lane, split out of CI by issue #147.
#
# These suites need what a per-PR lane cannot have: a database carrying the
# *ingested corpus*, a paid embeddings provider and an Anthropic key. Running
# them on every PR would spend real API money on docs-only changes (audit F-26)
# and would still need a hosted project to point at. So they run here, on
# demand, with secrets.
#
# The #129 contract holds in this lane too: the suites fail — naming the
# missing variable — rather than skipping, and the preflight below says so
# before spending an install on it. A check that skips its own assertions is a
# check that proves nothing.
#
# On demand only, until the beta is live (#212). One full run costs ≈US$8–12 in
# Anthropic + Voyage — measured in the 2026 baseline (#267) — so a weekly cron
# would run ≈US$40/month for a regression tripwire against an answer model
# that does not change on a schedule at all, and the corpus itself only
# changes quarterly (recrawl.yml). The PR gates already run on every change to
# the code these suites read, so a schedule would be buying coverage nothing
# here moves fast enough to need. Re-adding one later is a single line under
# `on:`; monthly (`0 5 1 * *`) is the recommended first step when the time
# comes. The preflight below is what keeps a dispatched run honest before #29
# provisions the corpus database and the secrets: it fails in seconds, naming
# every missing variable, instead of spending an install and a 90-minute
# timeout on a lane that cannot pass.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A dedicated, ingested test project — NOT production. These suites read
      # the corpus rather than writing it, but they are pointed by a secret and
      # #29 owns which project that names.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # retrieval.eval.test.ts's `grants` suite reads the legacy
      # SUPABASE_ANON_KEY rather than the publishable key its siblings use.
      # Collapsing the two names is #29's call, not this workflow's.
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EMBEDDINGS_PROVIDER: ${{ vars.EMBEDDINGS_PROVIDER }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      RERANK: ${{ vars.RERANK }}
      # Empty is "on" (expand.ts reads it with ||, like RERANK): the eval lane
      # measures the search production performs, expansion legs included.
      EXPAND: ${{ vars.EXPAND }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANSWER_MODEL: ${{ vars.ANSWER_MODEL }}
      EXPAND_MODEL: ${{ vars.EXPAND_MODEL }}
    steps:
      # Fail in seconds rather than after an install and a 90-minute
      # groundedness timeout, and name every missing variable at once. Mirrors
      # recrawl.yml's "refuse before doing the expensive thing" guard; the
      # in-suite gate (#129) remains the real backstop.
      - name: Require the eval environment
        run: |
          missing=""
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY \
                     EMBEDDINGS_PROVIDER VOYAGE_API_KEY ANTHROPIC_API_KEY; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          # A stub embedder would score the eval against meaningless vectors
          # and report a number nobody should trust.
          if [ "$EMBEDDINGS_PROVIDER" = "stub" ]; then
            missing="$missing EMBEDDINGS_PROVIDER(is 'stub')"
          fi
          if [ -n "$missing" ]; then
            echo "The eval lane cannot run — missing:$missing" >&2
            echo "These are repository secrets/variables; #29 provisions them." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:eval
      # #289 req. 1: the groundedness lane writes every answer it generated to
      # eval/transcripts/. `if: always()` on purpose — a red run is exactly the
      # one whose answers someone needs to read, and the gates are what turn it
      # red after the transcript is written.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-transcripts
          path: eval/transcripts/
          if-no-files-found: warn
          retention-days: 90
