name: Recrawl reminder

# The quarterly re-crawl of SPEC §3 is owner-run (#405, ADR 0010 amendment):
# GitHub-hosted runners cannot reach www.ccss.sa.cr or www.hacienda.go.cr, the
# hosts behind six of the corpus's documents, so this workflow no longer
# ingests. It reminds: on the 25th of the month before, it opens an issue with
# the checklist; on the 1st, it comments on that issue if it is still open (or
# opens it, if the 25th's run did not). The work itself is `pnpm recrawl` from
# the main checkout — `scripts/recrawl.sh`.
on:
  schedule:
    # 12:00 UTC (06:00 in Costa Rica) on the 25th of Dec/Mar/Jun/Sep — early
    # warning — and on the 1st of Jan/Apr/Jul/Oct, the due date, matching the
    # review cycle #121 asks its accepted risks to be re-examined on.
    - cron: "0 12 25 3,6,9,12 *"
    - cron: "0 12 1 1,4,7,10 *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or bump the quarterly recrawl issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # From the 15th on, the due date is next month's 1st; before it,
          # this month's. The 25th's run and the 1st's run name the same date.
          if [ "$(date -u +%d)" -ge 15 ]; then
            due=$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y-%m-%d)
          else
            due=$(date -u +%Y-%m-01)
          fi
          title="Quarterly recrawl due $due"

          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "Due today ($due) and still open. \`pnpm recrawl\` from the main checkout; the checklist is above."
            exit 0
          fi

          cat > body.md <<EOF
          The quarterly re-crawl ([SPEC §3](../blob/main/SPEC.md), [ADR 0010](../blob/main/docs/adr/0010-cli-ingestion-authoritative.md)) is due **$due**. It is owner-run: GitHub-hosted runners cannot reach \`www.ccss.sa.cr\` or \`www.hacienda.go.cr\` (#405).

          - [ ] From the main checkout on \`main\`, with the deploy wizard's env file beside it: \`pnpm recrawl\`. It checks the routing front doors, the manifest vigencia, ingests into production with Voyage embeddings, and compares \`eval/corpus-index.json\` by content.
          - [ ] If it says the corpus changed: commit \`eval/corpus-index.json\` on a branch and open a PR (#163).
          - [ ] If a routing URL failed: open it in a browser before editing \`src/lib/routing.ts\` — a Cloudflare 403 or an incomplete certificate chain is a warning, not a dead page.
          - [ ] Between November and January, the annual churn pass comes first ([runbook §2.2](../blob/main/docs/runbook.md)).
          - [ ] Close this issue with a one-line note: documents ingested, corpus changed or not.
          EOF
          gh issue create --title "$title" --label ready-for-human --body-file body.md
