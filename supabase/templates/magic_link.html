<h2>Entrar a Tramitico</h2>

<p>Siga este enlace para iniciar sesión:</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/"
    >Iniciar sesión</a
  >
</p>
<p>
  ¿Abrió este correo en otro navegador? Ingrese este código en la pestaña
  donde lo pidió:
</p>
<p>
  <code
    style="
      font-family:
        'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas,
        monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #aa342e;
      background: #fff4f3;
      border: 1px solid #e9bab5;
      border-radius: 6px;
      padding: 8px 16px;
      display: inline-block;
    "
    >{{ .Token }}</code
  >
</p>
<p>Si usted no pidió este correo, puede ignorarlo.</p>
